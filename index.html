<script>
/* 【2026-10-06】启动信标：把「页面走到哪一步 / 有没有报错」回报给本地服务器（POST /save?name=boot_*），
   文件落在 pvport/caps/。用于诊断用户报的「页面一直转圈、无红字」—— 下次一开页面就能看到卡在哪一步。
   失败一律静默（线上没有 /save 也没关系）。 */
(function () {
  var S = [];
  function beacon(step, extra) {
    S.push(step + (extra ? ' ' + extra : ''));
    try {
      fetch('/save?name=boot_' + step, { method: 'POST', body: JSON.stringify({ step: step, extra: String(extra || ''),
        ready: document.readyState, href: location.href, ua: (navigator.userAgent || '').slice(0, 60),
        trail: S.slice(-14), ver: (window.PV && PV.VER) || '', t: Date.now() }) }).catch(function () {});
    } catch (e) {}
  }
  window.__beacon = beacon;
  beacon('head');
  window.addEventListener('error', function (e) {
    beacon('error', String((e && e.message) || e) + ' @' + String((e && e.filename) || '').split('/').pop() + ':' + ((e && e.lineno) || 0));
  });
  window.addEventListener('unhandledrejection', function (e) { beacon('reject', String((e && e.reason) || e).slice(0, 140)); });
  document.addEventListener('DOMContentLoaded', function () { beacon('dom'); });
  window.addEventListener('load', function () { beacon('load'); });
  setTimeout(function () { beacon('t5'); }, 5000);
  setTimeout(function () { beacon('t15'); }, 15000);
})();
</script>

<script>
/* 【2026-10-06】带 ?reset=1 打开时：注销 service worker + 清空 Cache Storage 再自动回到 ?pre=0。
   用户报过「页面一直转圈加载不出东西」——SW 一旦代理了页面，旧的 sw.js/旧素材缓存会让它卡住。
   只在显式带 reset=1 时执行，正常访问不受影响。 */
if (location.search.indexOf('reset=1') >= 0) {
  (function () {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }).catch(function () {}));
    if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }).catch(function () {}));
    Promise.all(jobs).then(function () {
      if (location.search.indexOf('done=1') < 0) location.replace(location.pathname + '?pre=0&done=1');
    });
  })();
}
</script>
<script>
/* 素材缓存：首次播放后 hx 贴图/h3 帧池/avatars 不再重复下载（见 sw.js） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {}); });
}
</script>
